server {
  listen 80;
  client_max_body_size 21m;
  root /usr/share/nginx/html;
  # Wewnętrzny DNS Dockera: po restarcie kontenera API nginx odnajduje jego nowy adres (bez błędu 502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  location /api/ { proxy_pass $api_upstream; proxy_set_header Host $http_host; proxy_read_timeout 300s; }
  location /health/ { proxy_pass $api_upstream; proxy_set_header Host $http_host; }
  location / { try_files $uri /index.html; }
}
